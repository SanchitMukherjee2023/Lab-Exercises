<!DOCTYPE html>
<html>
<head>
    <title>23BC5126</title>
    <style>
        img{
        width: 150px;
        height: 150px;
        object-fit: cover;
        object-position: 100% 0;
        border: 2px solid black;
        border-radius: 50%;
        }
        @keyframes textChange
        {
            0%,100%{font-size: 15px; color:black}
            25%,75%{font-size: 20px; color:blueviolet; font-family:monospace}
            50%{font-size: 15px; color:violet; font-family: Fantasy,'Times New Roman', Times, serif;}
        }
        span{
            animation-name: textChange;
            animation-duration: 4s;
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body>
    <figure>
        <img src="Media/Gibrain_Alcocer.webp" alt="">
        <figcaption>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>Gibrain Alcocer</span></figcaption>
    </figure>
</body>
</html>
