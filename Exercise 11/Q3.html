<!DOCTYPE html>
<html>
<head>
  <title>23BCE5126</title>
  <style>
    body {
      font-family: Arial;
    }
    label {
      display: inline-block;
      width: 120px;
      margin-top: 10px;
    }
    input, select, textarea {
      margin-top: 10px;
    }
    .error {
      color: red;
      font-size: 0.9em;
      margin-left: 10px;
    }
    #time {
      float: right;
      border: 1px solid black;
      padding: 5px;
    }
  </style>
</head>
<body onload="startTime()">
  <div id="time"></div>
  <h2>Test JavaScript Form Validataion</h2>
  <form id="testForm" onsubmit="return validateForm()">
    <label>Name*:</label>
    <input type="text" name="name">
    <span class="error" id="nameErr"></span><br>

    <label>Address:</label>
    <textarea name="address" rows="2" cols="20"></textarea><br>

    <label>Zip Code*:</label>
    <input type="text" name="zip"><span class="error" id="zipErr"></span><br>

    <label>Country*:</label>
    <select name="country">
      <option value="">Please select...</option>
      <option>India</option>
      <option>USA</option>
      <option>UK</option>
    </select><br>

    <label>Gender*:</label>
    <input type="radio" name="gender" value="Male">Male
    <input type="radio" name="gender" value="Female">Female<br>

    <label>Preferences*:</label>
    <input type="checkbox" name="pref" value="Red">Red
    <input type="checkbox" name="pref" value="Green">Green
    <input type="checkbox" name="pref" value="Blue">Blue<br>

    <label>Phone*:</label>
    <input type="text" name="phone"><span class="error" id="phoneErr"></span><br>

    <label>Email*:</label>
    <input type="text" name="email"><span class="error" id="emailErr"></span><br>

    <label>Password*:</label>
    <input type="password" name="password"><span class="error" id="passErr"></span><br>

    <label>Verify Password*:</label>
    <input type="password" name="vpassword"><br>

    <label>Pan No:</label>
    <input type="text" name="pan"><span class="error" id="panErr"></span><br><br>

    <input type="submit" value="SEND">
    <input type="reset" value="CLEAR">
    <button type="button" onclick="printForm()">PRINT</button>
  </form>

  <script src="Q3.js"></script>
</body>
</html>
