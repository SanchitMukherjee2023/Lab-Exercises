<!DOCTYPE html>
<html>
    <head>
        <title>23BCE5126</title>
    </head>
    <body>
        <form style="width: 450px;">
            <fieldset>
                <legend>Login</legend>
                Username*<br>
                <input type="text"><br>
                Password*<br>
                <input type="text">
            </fieldset>
            <fieldset>
                <legend>Gender*</legend>
                <input type="radio" name="gender" id="male"> male
                <input type="radio" name="gender" id="female"> female
            </fieldset>
            <fieldset>
                <legend>Programming Skill</legend>
                <input type="checkbox" name="ps" id="java"> Java
                <input type="checkbox" name="ps" id="cpp" checked> C++
                <input type="checkbox" name="ps" id="ch"> C#
            </fieldset>
            <fieldset>
                <legend>Fruit</legend>
                Choose a fruit: 
                <select>
                    <optgroup label="Pome">
                        <option value="Apple">Apple</option>
                        <option value="Pear">Pear</option>
                    </optgroup>
                    <optgroup label="Citrus">
                        <option value="Orange">Orange</option>
                        <option value="Grapefruit">Grapefruit</option>
                        <option value="Mandarin">Mandarin</option>
                        <option value="Lime">Lime</option>
                    </optgroup>
                    <optgroup label="Stone">
                        <option value="Nectarine">Nectarine</option>
                        <option value="Apricot">Apricot</option>
                        <option value="Peach">Peach</option>
                        <option value="Plum">Plum</option>
                    </optgroup>
                    <optgroup label="Exotic">
                        <option value="Banana" selected>Banana</option>
                        <option value="Mango">Mango</option>
                    </optgroup>
                    <optgroup label="Berries">
                        <option value="Strawberry">Strawberry</option>
                        <option value="Blueberry">Blueberry</option>
                        <option value="Kiwifruit">Kiwifruit</option>
                        <option value="Passionfruit">Passionfruit</option>
                    </optgroup>
                    <optgroup label="Melons">
                        <option value="Watermelon">Watermelon</option>
                        <option value="Rockmelon">Rockmelon</option>
                        <option value="Honeydew melon">Honeydew melon</option>
                    </optgroup>
                </select>
            </fieldset>
            <textarea name="" id="" rows="10" cols="50" placeholder="Enter your comment here"></textarea><br>
            <input type="button" value="SEND">
            <input type="reset" value="RESET">
        </form>
    </body>
</html>
