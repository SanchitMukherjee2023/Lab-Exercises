<!DOCTYPE html>
<html>
    <head>
        <title>23BCE5126</title>
        <script>
            var x = parseInt(prompt("Operand 1",0));
            var op = prompt("Operator","+");
            var y = parseInt(prompt("Operand 2",0));
            var z;
            if(op=="+")
            z = x + y;
            else if(op=="-")
            z = x - y;
            else if(op=="/")
            z = x / y;
            else if(op=="*")
            z = x * y;
            else if(op=="%")
            z = x % y;
        alert(z);
        </script>
