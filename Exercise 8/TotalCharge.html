<!DOCTYPE html>
<html>
    <head>
        <title>23BCE5126</title>
        <script>
            var rph = parseInt(prompt("Enter Rate per hour"));
            var hours = parseInt(prompt("Enter number of hours worked"));
            var LC = rph * hours;
            var com = parseInt(prompt("Enter cost of materials"));
            var TC = LC + com;
            alert("Total Charge is Rs." + TC);
        </script>
    </head>
</html>
